name: Release

on:
  push:
    branches: [zh-cn]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: zh-cn
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $now = Get-Date
          $tag = "$($now.Year).$($now.Month).$($now.Day).$($now.ToString('HHmm'))"
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Tag: $tag"

      - name: Restore NuGet Packages
        run: dotnet restore RotationSolver/RotationSolver.csproj

      - name: Build Plugin
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj -p:AssemblyVersion=$tag -p:FileVersion=$tag -p:PackageVersion=$tag -p:InformationalVersion=$tag --output .\build

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "=== Files in .\build ==="
          Get-ChildItem .\build -Recurse | Select-Object FullName
          if (-not (Test-Path ".\build\RotationSolver.dll")) {
            Write-Error "RotationSolver.dll not found in .\build"
            exit 1
          }
          Write-Host "=== RotationSolver.dll found ==="

      - name: Cleanup Build Output
        shell: pwsh
        run: |
          Get-ChildItem .\build\* -Exclude RotationSolver.*,*.json,*.dll | Remove-Item -Force -Recurse
          Write-Host "=== After cleanup ==="
          Get-ChildItem .\build | Select-Object Name

      - name: Zip Plugin
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          Compress-Archive -Path .\build\* -DestinationPath .\build\latest.zip
          Write-Host "=== Zip content ==="
          (Get-Item .\build\latest.zip).Length

      - name: Generate pluginmaster.json
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $m = Get-Content "RotationSolver/RotationSolver.json" -Raw | ConvertFrom-Json
          $downloadUrl = "https://github.com/YangYangaaaa/RotationSolverReborn-zh/releases/download/$tag/latest.zip"
          $entry = @{
            Author = $m.Author
            Name = $m.Name
            InternalName = $m.InternalName
            AssemblyVersion = $tag
            TestingAssemblyVersion = $tag
            DalamudApiLevel = $m.DalamudApiLevel
            TestingDalamudApiLevel = $m.TestingDalamudApiLevel
            IsHide = $false
            IsTestingExclusive = $false
            DownloadLinkInstall = $downloadUrl
            DownloadLinkUpdate = $downloadUrl
            DownloadLinkTesting = $downloadUrl
            Changelog = "zh-CN localization"
            Tags = $m.Tags
            CategoryTags = $m.CategoryTags
            ApplicableVersion = "any"
            LoadRequiredState = 0
            LoadSync = $false
            CanUnloadAsync = $false
            LoadPriority = 0
            IconUrl = $m.IconUrl
            Punchline = $m.Punchline
            Description = $m.Description
            RepoUrl = "https://github.com/YangYangaaaa/RotationSolverReborn-zh"
            AcceptsFeedback = $true
          }
          $entry | ConvertTo-Json -Depth 10 -AsArray | Out-File -FilePath "pluginmaster.json" -Encoding utf8
          Write-Host "=== pluginmaster.json ==="
          Get-Content pluginmaster.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RotationSolverReborn-zh ${{ steps.version.outputs.tag }}
          body: |
            # RotationSolverReborn zh-CN ${{ steps.version.outputs.tag }}

            Based on FFXIV-CombatReborn/RotationSolverReborn upstream, UI text only:
            - RotationSolver/Data/UiString.cs (222 Description translations)
            - RotationSolver/UI/RotationConfigWindowTab.cs (sidebar tabs)
          files: |
            pluginmaster.json
            ./build/latest.zip
          prerelease: false
          make_latest: true

      - name: Deploy pluginmaster to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          full_commit_message: Deploy pluginmaster.json for ${{ steps.version.outputs.tag }}
