name: Release

on:
  push:
    branches: [zh-cn]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: zh-cn
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages
        run: dotnet restore RotationSolver/RotationSolver.csproj

      - name: Build Plugin
        shell: pwsh
        run: dotnet build --no-restore -c Release RotationSolver/RotationSolver.csproj --output .\build

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $tag = (Get-Date -Format "yyyyMMdd-HHmmss")
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Tag: $tag"

      - name: Prepare release zip and pluginmaster
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $buildDir = ".\build\RotationSolver"
          $outDir = ".\ReleaseOutput"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $zipName = "RotationSolverReborn-zh-$tag.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "$outDir\$zipName" -Force
          $m = Get-Content "RotationSolver/RotationSolver.json" -Raw | ConvertFrom-Json
          $downloadUrl = "https://github.com/YangYangaaaa/RotationSolverReborn-zh/releases/download/$tag/$zipName"
          $entry = @{
            Author = $m.Author
            Name = $m.Name
            InternalName = $m.InternalName
            AssemblyVersion = $tag
            TestingAssemblyVersion = $tag
            DalamudApiLevel = $m.DalamudApiLevel
            TestingDalamudApiLevel = $m.TestingDalamudApiLevel
            IsHide = $false
            IsTestingExclusive = $false
            DownloadLinkInstall = $downloadUrl
            DownloadLinkUpdate = $downloadUrl
            DownloadLinkTesting = $downloadUrl
            Changelog = "中文汉化版"
            Tags = $m.Tags
            ApplicableVersion = "any"
            LoadRequiredState = 0
            LoadSync = $false
            CanUnloadAsync = $false
            LoadPriority = 0
            IconUrl = $m.IconUrl
            AcceptsFeedback = $true
            RepoUrl = "https://github.com/YangYangaaaa/RotationSolverReborn-zh"
          }
          $entry | ConvertTo-Json -Depth 10 -AsArray | Out-File -FilePath "pluginmaster.json" -Encoding utf8
          Write-Host "=== pluginmaster.json ==="
          Get-Content pluginmaster.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RotationSolverReborn-zh ${{ steps.version.outputs.tag }}
          body: |
            # RotationSolverReborn 中文汉化版 ${{ steps.version.outputs.tag }}

            基于 FFXIV-CombatReborn/RotationSolverReborn 上游构建，仅汉化 UI 文案:
            - RotationSolver/Data/UiString.cs (222 条 Description 翻译)
            - RotationSolver/UI/RotationConfigWindowTab.cs (侧边栏 Tab 中文)

            翻译基于 RSR 官方 wiki + FF14 国服通行术语。
          files: |
            pluginmaster.json
            ReleaseOutput/*.zip
          prerelease: false
          make_latest: true

      - name: Deploy pluginmaster to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          full_commit_message: Deploy pluginmaster.json for ${{ steps.version.outputs.tag }}
